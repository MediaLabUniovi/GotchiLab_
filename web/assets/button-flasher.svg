<svg xmlns="http://www.w3.org/2000/svg" width="800" height="154" viewBox="0 0 800 154" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c182f" />
      <stop offset="50%" stop-color="#070d1a" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>

    <!-- Action Button Gradient (High Contrast Cyan to Mint) -->
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>

    <!-- Glow Effect for Left Icon -->
    <radialGradient id="iconRadialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    
    <!-- Pulse Glow behind action button -->
    <filter id="actionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.8px;
      fill: #00f0ff;
      text-transform: uppercase;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #00ff9d;
    }
    .headline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 23px;
      letter-spacing: 0.2px;
      fill: #ffffff;
    }
    .headline-cyan {
      fill: #00f0ff;
    }
    .subtext {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13.5px;
      fill: #94a3b8;
    }
    .action-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 14.5px;
      letter-spacing: 0.8px;
      fill: #040812;
      text-transform: uppercase;
    }
    .url-hint {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #64748b;
    }
  </style>

  <!-- Outer Drop Shadow Outline -->
  <rect x="2" y="2" width="796" height="150" rx="20" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="2.5" />

  <!-- Upper Glass Highlight -->
  <path d="M 22 4 L 778 4 C 788 4 794 10 794 20 L 794 40 C 700 35 100 35 6 40 L 6 20 C 6 10 12 4 22 4 Z" fill="#ffffff" fill-opacity="0.04" />

  <!-- TOP HEADER BAR: Kicker & Status -->
  <g transform="translate(26, 25)">
    <!-- Cyan tag -->
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#00f0ff" />
    <text x="16" y="8" class="kicker">GOTCHILAB_ WEB SERIAL DEPLOYER</text>
    
    <!-- Online status badge -->
    <circle cx="282" cy="5" r="4" fill="#00ff9d" />
    <text x="292" y="8" class="status-text">ONLINE • 1-CLIC DESDE CHROME / EDGE</text>
  </g>

  <!-- LEFT HERO ICON: Microchip + Lightning -->
  <g transform="translate(26, 45)">
    <!-- Radial Glow Behind Icon -->
    <circle cx="42" cy="42" r="42" fill="url(#iconRadialGlow)" />
    <!-- Icon Container -->
    <rect x="3" y="3" width="78" height="78" rx="18" fill="#091326" stroke="#00f0ff" stroke-width="2" />
    <!-- Lightning Bolt (Big & Punchy) -->
    <path d="M46 16L27 43H41L37 68L59 37H44L46 16Z" fill="url(#actionGrad)" stroke="#00f0ff" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- CENTER CONTENT: Big Title & Explanation -->
  <g transform="translate(126, 68)">
    <text x="0" y="0" class="headline">
      👉 <tspan class="headline-cyan">PULSA AQUÍ</tspan> PARA CARGAR TU ESP32 👈
    </text>
    <text x="0" y="26" class="subtext">
      ¿Sin Visual Studio Code ni librerías? Conecta por USB y graba el firmware al instante.
    </text>
    <text x="0" y="47" class="url-hint">
      🔗 Destino directo: <tspan fill="#38bdf8">https://gotchilab.medialab-uniovi.es/</tspan> (Web Serial API)
    </text>
  </g>

  <!-- RIGHT ACTION BUTTON: Glowing Clickable Pill Button -->
  <g transform="translate(588, 51)">
    <!-- Pulsing Action Pill -->
    <rect x="0" y="0" width="186" height="58" rx="29" fill="url(#actionGrad)" filter="url(#actionGlow)" />
    <rect x="0" y="0" width="186" height="58" rx="29" fill="url(#actionGrad)" />
    
    <!-- Click Hand Pointer & Label -->
    <g transform="translate(16, 36)">
      <!-- Hand Icon Vector -->
      <path d="M6 -14 C6 -16.5 8 -18.5 10.5 -18.5 C13 -18.5 15 -16.5 15 -14 L15 -6 C15.8 -6.6 16.8 -7 18 -7 C20.2 -7 22 -5.2 22 -3 L22 3 C22 8.5 17.5 13 12 13 C8.2 13 4 -1 1.5 -3.5 L0 -5 L5 -1 C5.5 -4 6 -9 6 -14 Z" fill="#040812" />
    </g>
    <text x="106" y="35" text-anchor="middle" class="action-label">¡FLASHEAR! ➔</text>
  </g>
</svg>
