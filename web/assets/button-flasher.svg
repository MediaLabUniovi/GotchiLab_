<svg xmlns="http://www.w3.org/2000/svg" width="800" height="138" viewBox="0 0 800 138" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c182f" />
      <stop offset="50%" stop-color="#070d1a" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>

    <!-- Action Gradient for Icons -->
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>

    <!-- Radial Glow for Left Icon -->
    <radialGradient id="iconRadialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #00f0ff;
      text-transform: uppercase;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #00ff9d;
    }
    .headline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 0.2px;
      fill: #ffffff;
    }
    .headline-cyan {
      fill: #00f0ff;
    }
    .subtext {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #94a3b8;
    }
    .url-hint {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Outer Drop Shadow Outline (The entire banner is the clickable button) -->
  <rect x="2" y="2" width="796" height="134" rx="18" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="2.5" />

  <!-- Upper Glass Highlight -->
  <path d="M 22 4 L 778 4 C 788 4 794 9 794 18 L 794 36 C 700 32 100 32 6 36 L 6 18 C 6 9 12 4 22 4 Z" fill="#ffffff" fill-opacity="0.04" />

  <!-- TOP HEADER BAR: Kicker & Status -->
  <g transform="translate(26, 23)">
    <!-- Cyan tag -->
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#00f0ff" />
    <text x="16" y="8" class="kicker">GOTCHILAB_ WEB SERIAL DEPLOYER</text>
    
    <!-- Online status badge -->
    <circle cx="280" cy="5" r="4" fill="#00ff9d" />
    <text x="290" y="8" class="status-text">ONLINE • FLASHEO DIRECTO POR USB EN CHROME / EDGE</text>
  </g>

  <!-- LEFT HERO ICON: Chip + Lightning Bolt -->
  <g transform="translate(26, 42)">
    <!-- Radial Glow Behind Icon -->
    <circle cx="36" cy="36" r="36" fill="url(#iconRadialGlow)" />
    <!-- Icon Container -->
    <rect x="2" y="2" width="68" height="68" rx="16" fill="#091326" stroke="#00f0ff" stroke-width="1.8" />
    <!-- Lightning Bolt Symbol -->
    <path d="M40 14L23 38H35L31 59L50 32H38L40 14Z" fill="url(#actionGrad)" stroke="#00f0ff" stroke-width="1" stroke-linejoin="round" />
  </g>

  <!-- MAIN CONTENT: Spacious Text Layout -->
  <g transform="translate(114, 62)">
    <text x="0" y="0" class="headline">
      👉 <tspan class="headline-cyan">PULSA AQUÍ</tspan> PARA CARGAR TU ESP32 👈
    </text>
    <text x="0" y="24" class="subtext">
      ¿Sin Visual Studio Code ni librerías? Conecta por USB y graba el firmware en 1 clic.
    </text>
    <text x="0" y="44" class="url-hint">
      🌐 https://gotchilab.medialab-uniovi.es/ <tspan fill="#64748b">• Web Serial API (Navegador)</tspan>
    </text>
  </g>

  <!-- RIGHT CHEVRON / ARROW -->
  <g transform="translate(738, 62)">
    <circle cx="16" cy="16" r="20" fill="#091326" stroke="#00f0ff" stroke-width="1.5" />
    <path d="M12 8L20 16L12 24" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
