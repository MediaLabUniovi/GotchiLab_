; =========================================================================
; PlatformIO Project Configuration for GotchiLab_
; Espressif ESP32 DevKit v1 - MediaLab_ Educational STEAM Tamagotchi
; =========================================================================

[platformio]
default_envs = full

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    sparkfun/SparkFun SCD4x Arduino Library
    sparkfun/SparkFun SCD30 Arduino Library

; Variante por defecto / retrocompatibilidad
[env:esp32dev]
build_flags =
    -DUSE_CO2_SENSOR=1
    -DUSE_LIGHT_SENSOR=1
    -DUSE_TOUCH_SENSOR=1
    -DUSE_BUZZER=1

; Perfil Completo: Todos los periféricos habilitados
[env:full]
build_flags =
    -DUSE_CO2_SENSOR=1
    -DUSE_LIGHT_SENSOR=1
    -DUSE_TOUCH_SENSOR=1
    -DUSE_BUZZER=1

; Perfil Sin CO2: Excluye driver SCD30 (optimización de costes)
[env:no_co2]
build_flags =
    -DUSE_CO2_SENSOR=0
    -DUSE_LIGHT_SENSOR=1
    -DUSE_TOUCH_SENSOR=1
    -DUSE_BUZZER=1

; Perfil Sin CO2 y Sin Zumbador: Operación visual silenciosa
[env:no_co2_silent]
build_flags =
    -DUSE_CO2_SENSOR=0
    -DUSE_LIGHT_SENSOR=1
    -DUSE_TOUCH_SENSOR=1
    -DUSE_BUZZER=0

; Perfil Sin CO2 ni Táctil: Auto-hatch activado sin interacción táctil
[env:no_co2_no_touch]
build_flags =
    -DUSE_CO2_SENSOR=0
    -DUSE_LIGHT_SENSOR=1
    -DUSE_TOUCH_SENSOR=0
    -DUSE_BUZZER=1

; Perfil Sin CO2 ni LDR: Mascota siempre despierta
[env:no_co2_no_light]
build_flags =
    -DUSE_CO2_SENSOR=0
    -DUSE_LIGHT_SENSOR=0
    -DUSE_TOUCH_SENSOR=1
    -DUSE_BUZZER=1

; Perfil Económico / Mínimo: Solo Display OLED y Botón de alimentación
[env:minimal]
build_flags =
    -DUSE_CO2_SENSOR=0
    -DUSE_LIGHT_SENSOR=0
    -DUSE_TOUCH_SENSOR=0
    -DUSE_BUZZER=0

; Perfil Completo Silencioso: Sensores completos sin Zumbador
[env:full_silent]
build_flags =
    -DUSE_CO2_SENSOR=1
    -DUSE_LIGHT_SENSOR=1
    -DUSE_TOUCH_SENSOR=1
    -DUSE_BUZZER=0

; Perfil Completo Sin Táctil: Auto-hatch con CO2, LDR y Zumbador
[env:full_no_touch]
build_flags =
    -DUSE_CO2_SENSOR=1
    -DUSE_LIGHT_SENSOR=1
    -DUSE_TOUCH_SENSOR=0
    -DUSE_BUZZER=1